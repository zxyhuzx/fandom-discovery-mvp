<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별줍 — 나의 별을 찾아보세요</title><meta name="description" content="좋아하는 작품과 캐릭터를 고르고, 흩어진 취향의 굿즈를 발견하세요."><link rel="icon" href="/assets/byeoljup-icon.png"><link rel="stylesheet" href="/assets/service.css"><link rel="stylesheet" href="/assets/brand.css"><link rel="stylesheet" href="/assets/welcome.css"><script src="/assets/theme.js"></script><script type="module" src="/assets/welcome.js"></script></head>
<body class="welcome-page"><main class="welcome-shell">
<p id="welcome-status" class="note" role="status" aria-live="polite"></p>
<section id="welcome-hello" class="welcome-step"><span class="welcome-star" aria-hidden="true">✦</span><h1 tabindex="-1">안녕하세요.<br>별을 주우러 오셨나요?</h1><p class="subtitle">흩어진 취향 속에서, 나의 별을 찾아보세요.</p><button id="welcome-start" class="primary" type="button">나의 별 선택하기</button><a class="welcome-skip" href="/app.html#home">다른 별들 탐색하기 →</a></section>
<section id="welcome-works" class="welcome-step" hidden><div class="welcome-step-count">1 / 3</div><h1 tabindex="-1">나의 별을 선택하세요</h1><label class="sr-only" for="welcome-work-search">작품·장르 검색</label><input id="welcome-work-search" type="search" autocomplete="off" placeholder="예: 하이큐, 원신, 홀로라이브"><div id="welcome-categories" class="welcome-categories" role="group" aria-label="작품 분류 필터"></div><div id="welcome-work-choices" class="welcome-options" role="group" aria-label="좋아하는 작품·장르 선택"></div><div class="welcome-selection"><p id="welcome-selected-count" class="note"></p><div id="welcome-selected-works" class="welcome-chips"></div></div><div class="welcome-actions"><button id="welcome-back-hello" class="secondary" type="button">이전</button><button id="welcome-next-characters" class="primary" type="button" disabled>캐릭터 선택하기</button></div></section>
<section id="welcome-characters" class="welcome-step" hidden><div class="welcome-step-count">2 / 3</div><h1 tabindex="-1">어떤 캐릭터를 좋아하세요?</h1><p class="subtitle">선택한 작품의 캐릭터를 여러 명 고를 수 있어요.<br>작품 전체를 선택해도 좋아요.</p><label class="sr-only" for="welcome-character-search">선택한 작품의 캐릭터 검색</label><input id="welcome-character-search" type="search" autocomplete="off" placeholder="캐릭터 이름으로 찾아보세요"><div id="welcome-character-choices" class="welcome-character-groups"></div><div class="welcome-actions"><button id="welcome-back-works" class="secondary" type="button">이전</button><button id="welcome-next-connect" class="primary" type="button">선택 완료</button></div></section>
<section id="welcome-connect" class="welcome-step" hidden><div class="welcome-step-count">3 / 3</div><span class="welcome-star" aria-hidden="true">✦</span><h1 tabindex="-1">내 별의 소식을 받아볼까요?</h1><p class="subtitle">관심사를 저장하고 새 소식을 받으려면<br>카카오 계정 연결이 필요해요.</p><div id="welcome-summary" class="welcome-summary"></div><button id="welcome-kakao" class="kakao" type="button">카카오로 연결하기</button><p class="note">지금은 계정 연결 없이 홈으로 이동해요.<br>카카오톡 메시지 알림은 준비 중이에요.</p><a id="welcome-browse" class="welcome-skip" href="/app.html#home">연결하지 않고 다른 별들 탐색하기 →</a><button id="welcome-back-characters" class="welcome-back" type="button">선택한 별 수정하기</button></section>
</main></body></html>
